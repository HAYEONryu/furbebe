# Install as .github/workflows/secret-manager-guard.yml only after IAM approval.
# Install guard.py as deploy/secret-manager-guard.py.
name: Secret Manager monthly access guard
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply cutoff or restoration (false performs read-only verification)'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: secret-manager-monthly-access-guard
  cancel-in-progress: false
jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' || vars.SECRET_MANAGER_GUARD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.SECRET_MANAGER_GUARD_WIF_PROVIDER }}
          service_account: secret-manager-guard@furbebe-backend.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Check and apply monthly access guard
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY" = true ]; then
            python3 deploy/secret-manager-guard.py --apply
          else
            python3 deploy/secret-manager-guard.py
          fi
