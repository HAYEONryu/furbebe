name: Animal Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: animal-sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/setup-python@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Collect animals into DEV database
        env:
          APP_ENV: development
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATABASE_URL_dev: ${{ secrets.DATABASE_URL_DEV }}
          SUPABASE_URL_dev: ${{ secrets.SUPABASE_URL_DEV }}
        run: >
          python -m backend.jobs.animal_sync.main
          --database-target supabase-dev
          --full
          --page-size 1000
          --batch-size 500
