name: Animal Sync

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database target
        type: choice
        options: [supabase-prod, supabase-dev]
        default: supabase-prod
      production_confirmation:
        description: Type APPROVED_PRODUCTION_SYNC for production
        type: string
        default: ''
      begin_date:
        description: YYYY-MM-DD; blank uses the last seven KST calendar days
        type: string
        default: ''
      end_date:
        description: YYYY-MM-DD; blank uses today in KST
        type: string
        default: ''
      full_scan:
        description: Explicitly collect the complete API default date window
        type: boolean
        default: false
  schedule:
    # Asia/Seoul: 00:00 and 12:00
    - cron: '0 3,15 * * *'

permissions:
  contents: read

jobs:
  development:
    if: >-
      (github.event_name == 'schedule' && vars.PRODUCTION_SYNC_ENABLED != 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'supabase-dev')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: animal-sync-dev
      cancel-in-progress: false
    env:
      APP_ENV: development
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      DATABASE_URL_dev: ${{ secrets.DATABASE_URL_DEV }}
      SUPABASE_URL_dev: ${{ secrets.SUPABASE_URL_DEV }}
      DB_POOL_SIZE: '1'
      DB_MAX_OVERFLOW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements-runtime-lock.txt
      - name: Sync DEV
        run: python -m backend.jobs.animal_sync.main --database-target supabase-dev --full --page-size 1000

  production:
    if: >-
      (github.event_name == 'schedule' && vars.PRODUCTION_SYNC_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'supabase-prod')
    environment: production-sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: animal-sync-prod
      cancel-in-progress: false
    env:
      APP_ENV: production
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      DATABASE_URL_prod: ${{ secrets.DATABASE_URL_PROD }}
      SUPABASE_URL_prod: ${{ vars.SUPABASE_URL_prod }}
      FURBEBE_PROD_PROJECT_REF: ${{ vars.FURBEBE_PROD_PROJECT_REF }}
      FRONTEND_ORIGIN: https://furbebe.site,https://www.furbebe.site
      DB_POOL_SIZE: '1'
      DB_MAX_OVERFLOW: '1'
      SYNC_EVENT: ${{ github.event_name }}
      SYNC_CONFIRMATION: ${{ inputs.production_confirmation }}
      SYNC_BEGIN_DATE: ${{ inputs.begin_date }}
      SYNC_END_DATE: ${{ inputs.end_date }}
      SYNC_FULL_SCAN: ${{ inputs.full_scan }}
    steps:
      - name: Validate production sync configuration
        run: |
          python - <<'PY'
          import os
          required = {
              'DATA_GO_KR_SERVICE_KEY': 'secret DATA_GO_KR_SERVICE_KEY',
              'DATABASE_URL_prod': 'secret DATABASE_URL_PROD',
              'SUPABASE_URL_prod': 'variable SUPABASE_URL_prod',
              'FURBEBE_PROD_PROJECT_REF': 'variable FURBEBE_PROD_PROJECT_REF',
          }
          missing = [label for key, label in required.items() if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing production sync configuration: ' + ', '.join(missing))
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements-runtime-lock.txt
      - name: Validate and sync explicit Production target
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from backend.jobs.animal_sync.main import main
          scheduled = os.environ['SYNC_EVENT'] == 'schedule'
          if not scheduled and os.environ['SYNC_CONFIRMATION'] != 'APPROVED_PRODUCTION_SYNC':
              raise SystemExit('Production confirmation required')
          args = ['--database-target', 'supabase-prod', '--page-size', '1000']
          if scheduled or os.environ['SYNC_FULL_SCAN'] == 'true':
              args += ['--full']
          else:
              today = datetime.now(ZoneInfo('Asia/Seoul')).date()
              begin = os.environ['SYNC_BEGIN_DATE'] or (today - timedelta(days=6)).isoformat()
              end = os.environ['SYNC_END_DATE'] or today.isoformat()
              args += ['--begin-date', begin, '--end-date', end, '--max-animals', '1000']
          raise SystemExit(main(args))
          PY
