name: Quality and container validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          FURBEBE_BUILD_TARGET: production
          VITE_API_BASE_URL: https://api.furbebe.site
          VITE_SITE_URL: https://furbebe.site
          # Synthetic canary only. No environment/repository server secrets here.
          DATABASE_URL: PHASE10_SERVER_SECRET_CANARY
          DATA_GO_KR_SERVICE_KEY: PHASE10_SERVER_SECRET_CANARY
      - name: Ensure no server canary or Cloud Run host entered build
        run: |
          if rg -l 'PHASE10_SERVER_SECRET_CANARY|https://[^" ]+\.run\.app' build; then
            echo 'Unexpected server configuration in build'
            exit 1
          fi
      - run: npm run check:worker
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: furbebe
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: furbebe_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      FURBEBE_TEST_DATABASE_URL: postgresql+psycopg://furbebe:ci-disposable-only@127.0.0.1:5432/furbebe_test_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r backend/requirements-dev.txt -c backend/requirements-runtime-lock.txt
      - run: ruff check .
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Build/run only. No registry push, GCP or Cloudflare deployment.
      - run: docker build -f backend/Dockerfile -t furbebe-api:ci .
      - run: bash deploy/docker-smoke.sh
